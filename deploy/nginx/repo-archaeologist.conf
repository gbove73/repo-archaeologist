# Questa configurazione conserva il prefisso atteso dall'applicazione e limita
# l'esposizione diretta del container alla sola interfaccia di loopback.
location = /repo-archaeologist {
    return 308 /repo-archaeologist/;
}

location /repo-archaeologist/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
